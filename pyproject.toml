[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus"
version = "0.7.0"
description = "An extensible OSINT investigation tool"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "python-dotenv",
    "dnspython",
    "rich",
    "publicsuffix2",
]

[project.scripts]
theseus = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "registry*", "tools*", "ui*"]

[tool.setuptools.package-data]
ui = ["assets/*.txt"]