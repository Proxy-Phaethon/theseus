[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus"
version = "0.1.0"
description = "OSINT investigation tool"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "python-dotenv",
    "dnspython",
]

[project.scripts]
theseus = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "tools*"]